[package]
name = "jwlmanager"
version = "0.1.0"
description = "JWL Manager - .jwlibrary archive manager"
edition = "2021"
rust-version = "1.88"

[lib]
name = "jwlmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: unknown-key round-trip preservation in Manifest's #[serde(flatten)]
# catch-all must read back in source order, not re-sorted alphabetically (01-02).
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# Pinned EXACT >=2.3 to close CVE-2025-29787 (symlink zip-slip variant); no open
# lower bound / no caret-to-next-major admitted (finding 13, 01-01-PLAN.md).
zip = "=8.6.0"
libloading = "0.9"
thiserror = "2"
sha2 = "0.11"
ts-rs = "12"
tempfile = "3"
# process_code/process_yr regex ports (JWLManager.py:930-931) — used only
# against internally-sourced KeySymbol strings, never raw user input.
# Phase 7 widens the surface: Clean/Mask (db::scrub) match Unicode
# Zs/Zl/Zp/L character classes against user-authored archive TEXT
# (Note/InputField/Bookmark/Location fields) to normalize or replace it —
# still never used to build SQL, only to classify/transform bound values.
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
