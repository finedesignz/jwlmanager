name: 'Release App (Tauri)'

# Cuts a build of the JWL Manager Tauri app when a tag matching `app-v*.*.*`
# is pushed. This is a DISTINCT tag prefix from the existing Python app's
# bare `v*` tags consumed by .github/workflows/release.yml -- reusing that
# prefix would collide with the Python app's already-shipping release
# workflow in this same repository.
#
# SIGNING ORDERING (D11-01, non-negotiable): Authenticode signing happens
# DURING Tauri bundling, via bundle.windows.signCommand, injected into the
# CI workspace's copy of app/src-tauri/tauri.conf.json immediately before
# `tauri build` runs. The committed tauri.conf.json in this repository is
# NEVER touched -- a guard test (app/src-tauri/tests/signing_wiring.rs)
# fails CI if a sign-command entry is ever accidentally committed. Signing
# is NEVER a post-build signtool pass: that would run after any future
# updater .sig computation and silently break update verification. This app
# has no updater yet (out of scope for this phase), but the ordering is
# wired correctly now so a future updater does not inherit a broken
# pipeline.
#
# FAIL CLOSED -- this is the actual, current state of this repository: the
# three Azure secrets (AZURE_CLIENT_ID / AZURE_CLIENT_SECRET /
# AZURE_TENANT_ID) and the repository variable ENABLE_MSI_SIGNING are NOT
# YET PROVISIONED. With the gate off (today's state):
#   - the build still runs to completion and stays green
#   - the produced Windows artifact is UNSIGNED
#   - it is uploaded ONLY as a workflow-run artifact (actions/upload-artifact)
#   - NO public GitHub Release is created -- publishing an unsigned Windows
#     binary publicly would violate this project's mandatory code-signing
#     rule (CLAUDE.md rule 22a: "never ship unsigned")
# Switching signing (and therefore public Release publishing) on is a pure
# operations action -- provision the three secrets plus the variable, no
# code change required. See app/src-tauri/signing/README.md and
# docs/signing.md for the full operator procedure.

on:
  push:
    tags:
      - 'app-v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (signed only if ENABLE_MSI_SIGNING == 'true')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: windows-latest-release-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-latest-release-cargo-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: npm ci
        working-directory: app
        run: npm ci

      # ---------------------------------------------------------------------
      # Authenticode signing via Azure Trusted Signing (GATED, default OFF).
      #
      # Both steps below run ONLY when the repository variable
      # ENABLE_MSI_SIGNING == 'true'. Until the Azure credentials exist and
      # that variable is flipped on, neither step runs and this build is
      # byte-for-byte identical (unsigned) to what it would be without this
      # entire signing section. See the workflow header comment above for
      # the full fail-closed contract.
      - name: Install Trusted Signing dlib (Microsoft.Trusted.Signing.Client)
        if: vars.ENABLE_MSI_SIGNING == 'true'
        shell: pwsh
        run: |
          $ver = '1.0.60'
          $out = Join-Path $env:RUNNER_TEMP 'trusted-signing'
          # nuget.exe ships on windows-latest runners. NOTE: no -ExcludeVersion
          # flag. `-ExcludeVersion:$false` is PowerShell's switch-with-value
          # syntax, which only works on PS cmdlets -- nuget.exe is a NATIVE
          # binary, so PowerShell hands it the literal string
          # "-ExcludeVersion:False" and nuget dies with `Unknown option`.
          # That flag's addition caused a real prior incident where the step
          # hard-failed and a build reported success having skipped signing
          # entirely (recorded in the remo-code reference this workflow was
          # adapted from). Omitting it is also what we want: nuget's DEFAULT
          # keeps the version in the folder name, which is exactly what the
          # $dll path construction below expects.
          nuget install Microsoft.Trusted.Signing.Client -Version $ver -OutputDirectory $out
          $dll = Join-Path $out "Microsoft.Trusted.Signing.Client.$ver\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            Write-Error "Trusted Signing dlib not found at $dll"
            exit 1
          }
          "TRUSTED_SIGNING_DLIB=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "TRUSTED_SIGNING_DLIB=$dll"

      - name: Inject bundle.windows.signCommand (this build only)
        if: vars.ENABLE_MSI_SIGNING == 'true'
        shell: pwsh
        run: |
          # Tauri runs signCommand with cwd = the Tauri project root, which
          # in THIS repository is app/src-tauri itself (unlike the remo-code
          # reference, where the script sits one level ABOVE the src-tauri
          # dir). The committed script lives INSIDE app/src-tauri at
          # signing/sign.ps1, so the injected path is `signing/sign.ps1`,
          # NOT `../signing/sign.ps1` -- that would resolve to app/signing/,
          # which does not exist. This is the single highest-consequence
          # detail in the whole signing wiring (RESEARCH Pitfall 1); the
          # guard test in app/src-tauri/tests/signing_wiring.rs proves this
          # string agrees with the script's real on-disk location.
          $confPath = 'app/src-tauri/tauri.conf.json'
          $conf = Get-Content -Raw -LiteralPath $confPath | ConvertFrom-Json
          $signCmd = 'powershell -ExecutionPolicy Bypass -File signing/sign.ps1 %1'
          if (-not $conf.bundle.windows) {
            $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue (@{}) -Force
          }
          $conf.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCmd -Force
          ($conf | ConvertTo-Json -Depth 20) | Set-Content -LiteralPath $confPath -Encoding utf8
          Write-Host "Injected bundle.windows.signCommand: $signCmd"

      - name: Build Tauri app (bundles + signs during bundling if enabled)
        working-directory: app
        env:
          # Azure Trusted Signing credentials -- harmless when signing is
          # OFF: with no signCommand injected, the Tauri bundler never
          # invokes sign.ps1, so these variables are simply unused.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_DLIB: ${{ env.TRUSTED_SIGNING_DLIB }}
        run: npm run tauri build

      - name: Upload build artifacts (workflow run only -- never a public Release by itself)
        uses: actions/upload-artifact@v4
        with:
          name: jwlmanager-windows-${{ github.ref_name }}
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish public GitHub Release (signing builds only)
    needs: build-windows
    # FAIL CLOSED: this is the SAME condition that gates the signing steps
    # above. With ENABLE_MSI_SIGNING absent or not 'true' (today's state),
    # this job does not run at all -- the workflow builds and uploads
    # unsigned artifacts to the workflow run and stops there. There is no
    # third path (no "publish unsigned with a warning" fallback).
    if: vars.ENABLE_MSI_SIGNING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jwlmanager-windows-${{ github.ref_name }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/**/*.msi
            dist/**/*.exe
